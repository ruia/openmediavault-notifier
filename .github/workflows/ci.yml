name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev fakeroot python3 python3-yaml php-cli git ca-certificates

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../openmediavault-notifier_*.deb dist/
          ls -l dist

      - name: Check changelog version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(dpkg-parsechangelog --show-field Version)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != changelog ${version}"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: openmediavault-notifier
          path: dist/*.deb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get install -y --no-install-recommends gh
          notes="$(dpkg-parsechangelog --show-field Changes | tail -n +4)"
          if gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.deb --clobber -R "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.deb -R "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" --notes "${notes}"
          fi
